name: Build and sign (draft release)

# Release flow: this workflow builds and signs the APK and creates a DRAFT release (not public).
# The draft is tested locally (unit tests, lint, browser end-to-end, Android 11 emulator);
# only then is it published with the "Publish tested release" workflow (publish-release.yml)
# or the "Publish release" button on GitHub. No tests run in GitHub Actions.
on:
  push:
    branches: [main]
    paths: # only files that end up in the APK (tests and docs never trigger a release)
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "core/src/main/**"
      - "core/build.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "VERSION"
      - "tools/release-version.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public fingerprint of the release signing certificate (also listed in README).
  # A release is refused if the APK is signed with any other certificate.
  EXPECTED_CERT_SHA256: "90:50:AE:5D:8D:5A:43:D9:E6:64:1B:34:A9:6A:0D:8C:2E:CA:44:7B:9F:1C:8D:C5:72:FE:79:0C:A7:E4:44:EB"
  # No Gradle build cache and no Actions cache/artifacts: nothing is stored in GitHub Actions storage.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"

jobs:
  release:
    name: Build, sign and create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select JDK 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
      - name: Verify Gradle wrapper checksum
        run: |
          version=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      # Version convention (README, "版本号规范"): VERSION is MAJOR.MINOR.PATCH, raised for every
      # release; versionCode = MAJOR * 1000000 + MINOR * 1000 + PATCH, so it only increases.
      # Fails if the APK changed but VERSION was not raised, or CHANGELOG.md has no entry for it.
      - name: Compute and check version
        id: version
        run: |
          result=$(tools/release-version.sh) # (no pipe: a failure must fail this step)
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

      - name: Restore and verify signing key
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          actual=$(keytool -list -v -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias androidwebcam | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate fingerprint does not match EXPECTED_CERT_SHA256."
            exit 1
          fi
          echo "Signing key verified."

      - name: Build signed release APK
        if: steps.version.outputs.skip == 'false'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: androidwebcam
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --stacktrace :app:assembleRelease -PawcVersionCode="$VERSION_CODE" -PawcVersionName="$VERSION_NAME"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify APK signature and metadata
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          # apksigner prints "Signer #1 certificate SHA-256 digest" (older) or "V3.0 Signer: certificate
          # SHA-256 digest" (newer); every signer certificate must be the pinned one.
          actual=$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/apksigner.txt" | awk '{print $4}' | sort -u)
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is not signed with the expected certificate."
            exit 1
          fi
          badging=$("$bt/aapt2" dump badging "$apk" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"

      - name: Prepare release files
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          apk="AndroidWebCam-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${apk}"
          (cd dist && sha256sum "${apk}" > SHA256SUMS.txt)
          sha=$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)
          {
            echo "## Android WebCam ${TAG}"
            echo
            echo "下载 \`${apk}\` 直接安装；已安装旧版本时会覆盖升级（同一签名，versionCode ${VERSION_CODE}）。"
            echo "Download \`${apk}\` and install it; it upgrades any previous version in place."
            echo
            echo "**校验 / Verify**"
            echo "- APK SHA-256: \`${sha}\`"
            echo "- 签名证书 SHA-256 / Signing certificate: \`${EXPECTED_CERT_SHA256}\`"
            echo
            echo "### 更新内容 / Changes"
            echo
            # This version's section of CHANGELOG.md (its headings one level lower).
            awk -v heading="## [${VERSION_NAME}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' \
              CHANGELOG.md | sed 's/^### /#### /'
            echo
            echo "<sub>commit ${GITHUB_SHA}</sub>"
          } > dist/notes.md
          cat dist/notes.md

      - name: Create draft release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Unpublished drafts (including an earlier build of this version whose tests failed) are
          # superseded by this build; published releases are never touched.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' |
            while read -r old; do
              echo "Deleting superseded draft ${old}"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
            done
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Android WebCam ${TAG}" --notes-file dist/notes.md
          echo "Draft ${TAG} created. Publish it after local tests pass."

