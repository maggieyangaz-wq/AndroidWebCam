<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Android WebCam</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<main id="login" class="panel" hidden>
  <div class="card">
    <img src="/favicon.svg" alt="" class="logo" width="56" height="56">
    <h1>Android WebCam</h1>
    <p data-i18n="loginHint">Enter the access code shown on the phone.</p>
    <form id="login-form" autocomplete="off">
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="one-time-code"
             spellcheck="false" maxlength="16" placeholder="XXXX-XXXX" aria-label="Access code" required>
      <button id="btn-connect" type="submit" data-i18n="connect">Connect</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
    <p class="note" data-i18n="secureNote">Encrypted with TLS 1.3 inside your local network.</p>
  </div>
</main>
<main id="viewer" hidden>
  <div id="stage">
    <canvas id="canvas" aria-label="Live camera"></canvas>
    <img id="mjpeg" alt="Live camera" hidden>
    <div id="overlay" class="overlay"><span id="status-text"></span></div>
  </div>
  <div id="toolbar">
    <span class="badge">&#9679; <span data-i18n="live">LIVE</span></span>
    <span id="stats"></span>
    <span class="spacer"></span>
    <button id="btn-snapshot" type="button" data-i18n-title="snapshot" title="Snapshot">&#128247;</button>
    <button id="btn-fullscreen" type="button" data-i18n-title="fullscreen" title="Fullscreen">&#x26F6;</button>
    <button id="btn-logout" type="button" data-i18n-title="logout" title="Disconnect">&#x23CF;</button>
  </div>
</main>
<noscript>JavaScript is required to view the stream.</noscript>
</body>
</html>
